name: Streamlit 看板保活

on:
  schedule:
    # 每 6 小时一次（Streamlit 12 小时没人看就会休眠）
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open the dashboard (wake it if asleep)
        run: python tools/wake_streamlit.py

      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wake-failed
          path: wake_failed.png
          if-no-files-found: ignore
